    [data-theme="neon"] {

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CRT SCANLINES & RASTER FX */
    .crt-container {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-card);
      box-shadow: 0 0 35px -5px var(--glow-color);
      transition: all 0.3s ease;
    }

    .crt-active .crt-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 30;
      opacity: 0.85;
      animation: crtFlicker 0.15s infinite;
    }

    .crt-active .crt-vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      z-index: 31;
    }

    @keyframes crtFlicker {
      0% { opacity: 0.82; }
      50% { opacity: 0.87; }
      100% { opacity: 0.83; }
    }

    /* Phosphor Glow */
    .glow-active {
      text-shadow: 0 0 5px var(--glow-color), 0 0 10px var(--glow-color);
    }

    .prompt-user { color: var(--prompt-user); font-weight: bold; }
    .prompt-path { color: var(--prompt-path); }
    .prompt-symbol { color: var(--accent-secondary); font-weight: bold; }

    /* Blinking Cursor */
    .cursor-block {
      display: inline-block;
      width: 9px;
      height: 1.15em;
      vertical-align: -0.15em;
      background-color: var(--accent-secondary);
      box-shadow: 0 0 8px var(--glow-color);
      animation: cursorBlink 0.9s infinite step-start;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Scrollbar Retro */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-accent);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-secondary);
    }

    /* Botones HUD */
    .hud-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-card);
      color: var(--text-dim);
      transition: all 0.2s ease;
      font-family: monospace;
    }
    .hud-btn:hover {
      border-color: var(--border-accent);
      color: var(--text-main);
      box-shadow: 0 0 12px var(--glow-color);
      transform: translateY(-1px);
    }
    .hud-btn.active {
      border-color: var(--accent-secondary);
      background: rgba(147, 51, 234, 0.2);
      color: #ffffff;
      box-shadow: 0 0 10px var(--glow-color);
    }

    /* Output Styling */
    .term-line {
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .term-highlight {
      color: var(--accent-secondary);
      font-weight: 600;
    }
    .term-success {
      color: #34d399;
      font-weight: 600;
    }
    .term-warn {
      color: #fbbf24;
    }
    .term-danger {
      color: #f87171;
    }
    .term-dim {
      color: var(--text-muted);
    }
    .term-link {
      color: var(--accent-secondary);
      text-decoration: underline;
      cursor: pointer;
    }
    .term-link:hover {
      color: #ffffff;
      text-shadow: 0 0 8px var(--glow-color);
    }

    @keyframes pulseLed {

      50% { transform: scale(1.25); opacity: 0.4; }
    }

    /* Matrix Rain Canvas */

      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #matrixCanvas.active {
      opacity: 0.18;

    /* ------------------------------------------------------------
       2. MOTOR DE AUDIO SINTÉTICO EN VIVO (WEB AUDIO API)
       ------------------------------------------------------------ */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Clic mecánico táctil (tecleo suave)
    function playKeyClick() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      // Frecuencia sutil tipo switch mecánico ligero
      osc.frequency.setValueAtTime(450 + Math.random() * 200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.018);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.Q.setValueAtTime(3, now);

      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.022);
    }

    // Bip de confirmación / ejecución exitosa
    function playExecuteBeep() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.06);

      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.075);
    }

    // Alerta de error / comando no reconocido
    function playErrorBeep() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'square';
      osc1.frequency.setValueAtTime(160, now);
      osc2.frequency.setValueAtTime(225, now);

      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.15);
      osc2.stop(now + 0.15);
    }

    // Radar blip para el comando audit
    function playAuditBlip(freq = 1200) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.055);
    }

    // Chime para reliquias y cambio de temas
    function playRelicChime() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      [619, 928, 1238].forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.04);
        gain.gain.setValueAtTime(0.035, now + idx * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.04 + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.04);
        osc.stop(now + idx * 0.04 + 0.13);
      });
    }

    /* ------------------------------------------------------------
       3. CONTROLES HUD: CRT, SONIDO, TEMAS, FULLSCREEN
       ------------------------------------------------------------ */
    let crtEnabled = true;
    let glowEnabled = true;
    let currentTheme = "anuu";

    function toggleCrt() {
      crtEnabled = !crtEnabled;
      const wrapper = document.getElementById("crtWrapper");
      const btn = document.getElementById("crtToggleBtn");
      const label = document.getElementById("crtLabel");
      if (crtEnabled) {
        wrapper.classList.add("crt-active");
        btn.classList.add("active");
        label.textContent = "CRT: ON";
      } else {
        wrapper.classList.remove("crt-active");
        btn.classList.remove("active");
        label.textContent = "CRT: OFF";
      }
      playExecuteBeep();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundToggleBtn");
      const icon = document.getElementById("soundIcon");
      const label = document.getElementById("soundLabel");
      if (soundEnabled) {
        btn.classList.add("active");
        icon.textContent = "🔊";
        label.textContent = "SOUND: ON";
        initAudio();
        playExecuteBeep();
      } else {
        btn.classList.remove("active");
        icon.textContent = "🔇";
        label.textContent = "SOUND: OFF";
      }
    }

    function toggleGlow() {
      glowEnabled = !glowEnabled;
      const body = document.getElementById("terminalBody");
      const btn = document.getElementById("glowToggleBtn");
      const label = document.getElementById("glowLabel");
      if (glowEnabled) {
        body.classList.add("glow-active");

      } else {
        body.classList.remove("glow-active");
        btn.classList.remove("active");
        label.textContent = "GLOW: OFF";
      }
      playExecuteBeep();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
      playExecuteBeep();
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      
      const themeBtns = ["anuu", "blood", "gw2", "bioinfo", "duat", "neon"];
      themeBtns.forEach(t => {
        const b = document.getElementById("tbtn-" + t);
        if (b) {
          if (t === theme) b.classList.add("active");
          else b.classList.remove("active");
        }
      });
      playRelicChime();
    }

    function clearTerminal() {
      const output = document.getElementById("terminalOutput");
      output.innerHTML = "";
      playExecuteBeep();
      focusInput();
    }

    /* ------------------------------------------------------------
       4. GESTIÓN DEL CLI, CURSOR E HISTORIAL
       ------------------------------------------------------------ */
    const cliInput = document.getElementById("cliInput");
    const renderedInput = document.getElementById("renderedInput");
    const cliCursor = document.getElementById("cliCursor");
    const terminalOutput = document.getElementById("terminalOutput");
    const terminalBody = document.getElementById("terminalBody");

    let commandHistory = [];
    let historyIndex = -1;
    let isExecutingCommand = false;

    function focusInput() {
      cliInput.focus();
    }

    cliInput.addEventListener("input", (e) => {
      renderedInput.textContent = cliInput.value;
      playKeyClick();
    });

    cliInput.addEventListener("keydown", (e) => {
      initAudio();

      if (e.key === "Enter") {
        e.preventDefault();
        if (isExecutingCommand) return;
        const cmd = cliInput.value;
        cliInput.value = "";
        renderedInput.textContent = "";
        executeCommand(cmd);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (commandHistory.length > 0) {
          if (historyIndex === -1) historyIndex = commandHistory.length - 1;
          else if (historyIndex > 0) historyIndex--;
          cliInput.value = commandHistory[historyIndex] || "";
          renderedInput.textContent = cliInput.value;
          playKeyClick();
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (commandHistory.length > 0 && historyIndex !== -1) {
          if (historyIndex < commandHistory.length - 1) {
            historyIndex++;
            cliInput.value = commandHistory[historyIndex] || "";
          } else {
            historyIndex = -1;
            cliInput.value = "";
          }
          renderedInput.textContent = cliInput.value;
          playKeyClick();
        }
      } else if (e.key === "Tab") {
        e.preventDefault();
        handleTabCompletion();
      }
    });

    function printLine(htmlContent, className = "") {
      const div = document.createElement("div");
      div.className = "term-line " + className;
      div.innerHTML = htmlContent;
      terminalOutput.appendChild(div);
      terminalBody.scrollTop = terminalBody.scrollHeight;
      return div;
    }

    function runCommandText(text) {
      if (isExecutingCommand) return;
      initAudio();
      focusInput();
      executeCommand(text);
    }

    /* ------------------------------------------------------------
       5. SISTEMA DE AUTOCOMPLETADO TAB
       ------------------------------------------------------------ */
    const KNOWN_COMMANDS = [
      "help", "whoami", "skills", "services", "audit", "relics",
      "cat relic ", "open relic ", "theme ", "signal", "clear",
      "council", "matrix", "crt on", "crt off", "sound on", "sound off",
      "date", "uptime", "history", "echo ", "banner", "set", "rosagris", "anuu", "161914", "sudo",
      "mic", "viz on", "viz off", "latency ", "hw"
    ];

    function handleTabCompletion() {
      const current = cliInput.value.trimStart();
      if (!current) return;

      // Autocompletar cat relic <id> o open relic <id>
      if (current.startsWith("cat relic ") || current.startsWith("open relic ")) {
        const prefix = current.startsWith("cat relic ") ? "cat relic " : "open relic ";
        const query = current.slice(prefix.length).toLowerCase();
        const matches = RELICS_DB.filter(r => r.id.startsWith(query));
        if (matches.length === 1) {
          cliInput.value = prefix + matches[0].id;
          renderedInput.textContent = cliInput.value;
          playKeyClick();
        } else if (matches.length > 1) {
          printLine(`<span class="term-dim">Posibles reliquias:</span> ${matches.map(m => `<span class="term-highlight">${m.id}</span>`).join(", ")}`);
          playExecuteBeep();
        }
        return;
      }

      // Autocompletar theme <name>
      if (current.startsWith("theme ")) {
        const query = current.slice(6).toLowerCase();
        const themes = ["anuu", "blood", "gw2", "bioinfo", "duat", "neon"];
        const matches = themes.filter(t => t.startsWith(query));
        if (matches.length === 1) {
          cliInput.value = "theme " + matches[0];
          renderedInput.textContent = cliInput.value;
          playKeyClick();
        } else if (matches.length > 1) {
          printLine(`<span class="term-dim">Temas disponibles:</span> ${matches.join(", ")}`);
          playExecuteBeep();
        }
        return;
      }

      // Comandos raíz
      const matches = KNOWN_COMMANDS.filter(c => c.startsWith(current.toLowerCase()));
      if (matches.length === 1) {
        cliInput.value = matches[0];
        renderedInput.textContent = cliInput.value;
        playKeyClick();
      } else if (matches.length > 1) {
        printLine(`<span class="term-dim">Comandos:</span> ${matches.map(m => `<span class="term-highlight">${m.trim()}</span>`).join("  ")}`);
        playExecuteBeep();
      }
    }

    /* ------------------------------------------------------------
       6. EJECUTOR DE COMANDOS
       ------------------------------------------------------------ */
    async function executeCommand(rawCmd) {
      const trimmed = rawCmd.trim();
      
      // Imprimir el comando tecleado en el buffer
      printLine(`<span class="prompt-user">kali@anuu-core</span><span class="text-zinc-500">:</span><span class="prompt-path">~</span><span class="prompt-symbol">$</span> ${escapeHtml(rawCmd)}`);

      if (!trimmed) {
        terminalBody.scrollTop = terminalBody.scrollHeight;
        return;
      }

      commandHistory.push(trimmed);
      historyIndex = -1;

      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const arg1 = parts[1] ? parts[1].toLowerCase() : "";
      const arg2 = parts[2] ? parts[2].toLowerCase() : "";

      switch (cmd) {
        case "help":
          playExecuteBeep();
          showHelp();
          break;

        case "whoami":
          playExecuteBeep();
          showWhoami();
          break;

        case "skills":
          playExecuteBeep();
          showSkills();
          break;

        case "services":
          playExecuteBeep();
          showServices();
          break;

        case "audit":
          const target = parts[1] || "127.0.0.1 (K4L1 Core Localhost)";
          await runAuditSimulation(target);
          break;

        case "relics":
          playExecuteBeep();
          showRelics();
          break;

        case "cat":
          if (arg1 === "relic" && arg2) {
            showRelicDetail(arg2);
          } else if (arg1 && arg1 !== "relic") {
            showRelicDetail(arg1);
          } else {
            playErrorBeep();
            printLine(`<span class="term-danger">Error:</span> Uso: 'cat relic &lt;id&gt;' o 'cat &lt;id&gt;'. Escribe 'relics' para ver la lista.`, "term-dim");
          }
          break;

        case "open":
          if (arg1 === "relic" && arg2) {
            openRelic(arg2);
          } else if (arg1) {
            openRelic(arg1);
          } else {
            playErrorBeep();
            printLine(`<span class="term-danger">Error:</span> Uso: 'open relic &lt;id&gt;'. Escribe 'relics' para ver los identificadores.`);
          }
          break;

        case "theme":
          if (["anuu", "blood", "gw2", "bioinfo", "duat", "neon"].includes(arg1)) {
            setTheme(arg1);
            printLine(`<span class="term-success">✓</span> Paleta cuántica cambiada a: <span class="term-highlight">${arg1.toUpperCase()}</span>`);
          } else {
            playErrorBeep();
            printLine(`<span class="term-danger">Error:</span> Tema desconocido '${arg1}'. Disponibles: <span class="term-highlight">anuu, blood, gw2, bioinfo, duat, neon</span>`);
          }
          break;

        case "crt":
          if (arg1 === "off") {
            if (crtEnabled) toggleCrt();
            printLine(`<span class="term-dim">Raster CRT: DESACTIVADO.</span>`);
          } else if (arg1 === "on") {
            if (!crtEnabled) toggleCrt();
            printLine(`<span class="term-success">Raster CRT: ACTIVADO.</span>`);
          } else {
            toggleCrt();
            printLine(`Raster CRT conmutado: ${crtEnabled ? 'ON' : 'OFF'}`);
          }
          break;

        case "sound":
          if (arg1 === "off") {
            if (soundEnabled) toggleSound();
            printLine(`<span class="term-dim">Sintetizador de audio: SILENCIADO.</span>`);
          } else if (arg1 === "on") {
            if (!soundEnabled) toggleSound();
            printLine(`<span class="term-success">Sintetizador de audio: ACTIVADO.</span>`);
          } else {
            toggleSound();
            printLine(`Sintetizador Web Audio conmutado: ${soundEnabled ? 'ON' : 'OFF'}`);

        case "signal":
          playExecuteBeep();

          window.open("https://signal.me/#u/k4li.89", "_blank");

        case "clear":
          clearTerminal();
          break;

        case "history":

          commandHistory.forEach((h, i) => {

          text: `[TARPIT 1.8s] Ejecutando cálculo Proof-of-Work WebCrypto (500.000 iteraciones PBKDF2 HMAC-SHA512)`
        },
        {
          delay: 600,
          freq: 1200,
          text: `[TARPIT 2.4s] Encapsulando secreto compartido híbrido (NIST FIPS 203 ML-KEM-768 Kyber-Ready)`
        },
        {
          delay: 600,
          freq: 1619,
          text: `[TARPIT 3.0s] Muro Kanuv franqueado: Transfiriendo enlace a la Cámara Negra Soberana...`
        }
      ];

      for (let s of tarpitSteps) {
        await sleep(s.delay);
        playAuditBlip(s.freq);
        printLine(`<span class="term-success">⚡</span> ${s.text}`);
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }

      await sleep(200);
      playExecuteBeep();
      printLine(`\n<span class="term-success">✓ COMPUERTA SOBERANA DESBLOQUEADA. Redirigiendo a sovereign_sanctuary.html...</span>\n`);
      terminalBody.scrollTop = terminalBody.scrollHeight;

      setTimeout(() => {
        window.open("sovereign_sanctuary.html", "_blank") || (window.location.href = "sovereign_sanctuary.html");
        isExecutingCommand = false;
        cliInput.disabled = false;
        focusInput();
      }, 500);
    }

    /* ------------------------------------------------------------
       9. LLUVIA DIGITAL MATRIX CUÁNTICA
       ------------------------------------------------------------ */
    let matrixActive = false;
    let matrixInterval = null;
    const matrixCanvas = document.getElementById("matrixCanvas");
    const mCtx = matrixCanvas.getContext("2d");

    function resizeMatrixCanvas() {
      matrixCanvas.width = matrixCanvas.parentElement.clientWidth;
      matrixCanvas.height = matrixCanvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeMatrixCanvas);

    function toggleMatrixRain() {
      matrixActive = !matrixActive;
      if (matrixActive) {
        matrixCanvas.classList.add("active");
        resizeMatrixCanvas();
        startMatrixRain();
        printLine(`<span class="term-success">Matrix Rain activado en el buffer cuántico.</span>`);
      } else {
        matrixCanvas.classList.remove("active");
        if (matrixInterval) clearInterval(matrixInterval);
        printLine(`<span class="term-dim">Matrix Rain pausado.</span>`);
      }
    }

    function startMatrixRain() {
      const chars = "161914ANUUSET010101XYZKALI89ΩΨΔΞ";
      const fontSize = 13;
      const columns = Math.floor(matrixCanvas.width / fontSize);
      const drops = Array(columns).fill(1);

      if (matrixInterval) clearInterval(matrixInterval);

      matrixInterval = setInterval(() => {
        const lv = (termVizOn && window.K4HUD) ? K4HUD.audioLevel() : 0;
        mCtx.fillStyle = "rgba(0, 0, 0, 0.06)";
        mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

        mCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent-secondary").trim() || "#c084fc";
        mCtx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i] += (lv > 0.12 && Math.random() < lv) ? 3 : 1;
        }
      }, 35);
    }

    /* ------------------------------------------------------------
       10. RELOJ HUD Y UTILIDADES
       ------------------------------------------------------------ */
    function updateClock() {
      const d = new Date();
      const pad = (n) => n.toString().padStart(2, "0");
      const str = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
      const elem = document.getElementById("clockDisplay");
      if (elem) elem.textContent = str;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Inicialización al cargar la página
    window.addEventListener("DOMContentLoaded", () => {
      showBanner();
      focusInput();
      document.body.addEventListener("click", () => initAudio(), { once: true });
    });
  </script>

<script>
  /* Visualizador de cabecera: barras FFT reales de la entrada armada con `mic` (no simula nada si no hay entrada) */
  var termVizOn = true;
  (function () {
    var cv = document.getElementById('termViz'); if (!cv) return;
    var c = cv.getContext('2d'), bars = 16;
    (function loop() {
      requestAnimationFrame(loop);
      if (document.hidden) return;
      c.clearRect(0, 0, cv.width, cv.height);
      var armed = termVizOn && window.K4HUD && K4HUD.audio.armed;
      if (!armed) { c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(0, cv.height - 2, cv.width, 1); return; }
      var an = K4HUD.audio.an, data = new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(data);
      var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-secondary').trim() || '#c084fc';
      for (var i = 0; i < bars; i++) {
        var a = Math.floor(Math.pow(i / bars, 2) * data.length * 0.5), b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / bars, 2) * data.length * 0.5));
        var p = 0; for (var k = a; k < b; k++) if (data[k] > p) p = data[k];
        var h = Math.max(1, (p / 255) * (cv.height - 2));
        c.fillStyle = accent; c.fillRect(i * 4, cv.height - h, 3, h);
      }
    })();
  })();
</script>
