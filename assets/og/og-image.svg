<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">K4L1 STUDIO</title>
  <desc id="d">Anuu-Forge · Forense · Audio DSP · IA local. Emblema ankh cian sobre fondo obsidiana.</desc>
  <defs>
    <radialGradient id="purple" cx="1180" cy="-20" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9333EA" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#9333EA" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="285" cy="285" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#00F5D4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="600" cy="315" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F5D4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#gridfade)"/></mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo obsidiana -->
  <rect width="1200" height="630" fill="#080312"/>
  <rect width="1200" height="630" fill="url(#purple)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Emblema ankh + halo -->
  <g fill="none" stroke="#00F5D4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="285" cy="285" r="205" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="2 10"/>
    <circle cx="285" cy="285" r="178" stroke-opacity="0.55" stroke-width="2"/>
    <g filter="url(#glow)" stroke-width="12">
      <ellipse cx="285" cy="205" rx="52" ry="68"/>
      <path d="M285 273V415"/>
      <path d="M215 318H355"/>
    </g>
  </g>
  <circle cx="285" cy="205" r="6" fill="#00F5D4"/>
  <!-- marcas de brújula -->
  <g stroke="#00F5D4" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <path d="M285 92V108M285 462V478M172 285H188M382 285H398"/>
  </g>

  <!-- Separador -->
  <path d="M520 150V420" stroke="#00F5D4" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Texto -->
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">
    <text x="560" y="262" font-size="40" fill="#00F5D4" fill-opacity="0.75" letter-spacing="6">&gt;_</text>
    <text x="558" y="352" font-size="84" font-weight="700" fill="#F5F0FF" letter-spacing="1">K4L1 STUDIO</text>
    <text x="561" y="406" font-size="22" fill="#00F5D4">Anuu-Forge · Forense · Audio DSP · IA local</text>
  </g>

  <!-- Franja inferior -->
  <rect y="566" width="1200" height="64" fill="#9333EA" fill-opacity="0.10"/>
  <path d="M0 566H1200" stroke="#00F5D4" stroke-opacity="0.35" stroke-width="1"/>
  <text x="600" y="605" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="20" fill="#CDBDF5" letter-spacing="1">airgap-ready · 0 € / mes · Concilio ACE 161914</text>

  <!-- Viñeta -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
