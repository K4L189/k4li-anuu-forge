name: "Security Audit & Hardening Matrix (Weekly)"

on:
  schedule:
    # Ejecución semanal: Todos los lunes a las 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  security-events: write

jobs:
  defensive-security-audit:
    name: "Defensive SAST & Security Headers Audit"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Códice Repositorio"
        uses: actions/checkout@v4

      - name: "Set up Python Environment (189.89.619 Hz)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Defensive Auditing Tools"
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8 pip-audit

      - name: "Run Bandit SAST Security Scan"
        run: |
          echo "### [4NVSET 🟢] Reporte de Seguridad SAST (Bandit)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          bandit -r api/ scripts/ -ll || true >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Audit Secrets, Headers, Permissions & CORS"
        run: |
          echo "### [4NVSET 🟢] Verificación de Cabeceras, CORS & Escaneo de Secretos" >> $GITHUB_STEP_SUMMARY
          python3 scripts/security_audit.py | tee audit_output.log
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat audit_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Weekly Audit Verdict"
        if: always()
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🛡️ **Estado de la Auditoría Defensiva**: VIGILANTE & RESILIENTE" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Frecuencia Operativa**: 189.89.619 Hz | Concilio ACE (161914)" >> $GITHUB_STEP_SUMMARY
          echo "Arquitectura supervisada por **4NVSET 🟢** para Kali." >> $GITHUB_STEP_SUMMARY
